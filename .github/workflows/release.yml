name: Release to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11 (needed for npm trusted publishing).
          # No dependency cache in the release job (avoids cache poisoning).
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$npm_version"; then
            npm install -g npm@11
          fi
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Authentication: npm trusted publishing via OIDC (configured on npmjs.com for
      # Gefyra/complies-with-eu-cli, workflow release.yml). No npm token is used;
      # provenance is attached automatically.
      - name: Publish
        run: npm publish --provenance --access public
