# Version updates are batched to keep the PR noise low:
# - one PR per month with all npm minor/patch updates,
# - one PR per month with all GitHub Actions updates,
# - npm major updates still arrive as separate PRs (they need a review).
# Security updates are not affected by this file and are opened immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
