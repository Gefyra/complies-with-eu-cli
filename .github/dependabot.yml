# Version updates are batched to keep the PR noise low:
# - one PR per month with all npm minor/patch updates,
# - one PR per month with all GitHub Actions updates,
# - npm major updates still arrive as separate PRs (they need a review).
# Security updates are not affected by this file and are opened immediately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # chalk >= 5 and inquirer >= 9 are ESM-only; the CLI is CommonJS and uses
      # require(). Upgrading needs a migration (dynamic import() or ESM), not a bump.
      - dependency-name: chalk
        update-types: ["version-update:semver-major"]
      - dependency-name: inquirer
        update-types: ["version-update:semver-major"]
      # ora >= 6 is ESM-only as well (ora 10 also requires Node 22).
      - dependency-name: ora
        update-types: ["version-update:semver-major"]
      # commander >= 15 is ESM-only and requires Node >= 22.12; revisit when
      # Node 20 support is dropped (engines.node is ">=20").
      - dependency-name: commander
        versions: [">=15"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
