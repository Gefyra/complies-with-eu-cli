name: Bug report
description: Report incorrect behaviour of the complies-with-eu CLI
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Do not report security vulnerabilities here.** Please follow the [security policy](https://github.com/Gefyra/complies-with-eu-cli/security/policy) instead.
        Please remove tokens, internal URLs and confidential profile content from logs before you post them.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - CLI (complies-with-eu)
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen instead.
    validations:
      required: true
  - type: input
    id: cli-version
    attributes:
      label: CLI version
      description: Output of `complies-with-eu --version`
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v20.18.0"
  - type: input
    id: java-version
    attributes:
      label: Java version
      description: First line of `java -version`
      placeholder: 'openjdk version "21.0.5"'
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran.
      render: shell
      placeholder: complies-with-eu validate de.example.package@1.0.0 https://example.org/fhir/StructureDefinition/MyPatient --eu-profiles http://hl7.eu/fhir/base/StructureDefinition/patient-eu-core
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: FHIR package (name@version)
      placeholder: "de.example.package@1.0.0"
  - type: input
    id: canonical
    attributes:
      label: Profile canonical URL
      placeholder: "https://example.org/fhir/StructureDefinition/MyPatient"
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Console output, JSON output or the relevant part of the generated report.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that helps, e.g. whether the package is public.
